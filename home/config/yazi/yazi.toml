[opener]
edit = [
	{ run = '${EDITOR:-micro} %s', block = true, desc = "editor", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = [ "edit" ] },
	{ mime = "inode/empty", use = [ "edit" ] },
	{ mime = "application/{json,ndjson,javascript,toml,xml,yaml,x-yaml,wine-extension-ini}", use = [ "edit" ] },
	{ url = "*", use = [ "edit" ] },
]
